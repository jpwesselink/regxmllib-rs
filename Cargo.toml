[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
license      = "MIT"
repository   = "https://github.com/jpwesselink/regxmllib-rs"
homepage     = "https://github.com/jpwesselink/regxmllib-rs"
authors      = ["JP Wesselink"]

[workspace]
members = [
    "crates/smpte-types",
    "crates/smpte-klv",
    "crates/smpte-mxf",
    "crates/regxml-dict",
    "crates/regxml",
    "crates/regxmllib-cli",
]
resolver = "2"

[workspace.dependencies]
thiserror   = "2"
anyhow      = "1"
quick-xml   = { version = "0.37", features = ["serialize"] }
serde       = { version = "1", features = ["derive"] }
uuid        = { version = "1", features = ["v4"] }
half        = "2"
clap        = { version = "4", features = ["derive"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
encoding_rs = "0.8"
roxmltree   = "0.21"
proptest    = "1"
criterion   = { version = "0.5", features = ["html_reports"] }
