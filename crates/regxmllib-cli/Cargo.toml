[package]
name             = "regxmllib-cli"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
description  = "Java-free RegXML CLI toolchain — drop-in replacement for sandflow/regxmllib"
keywords     = ["smpte", "regxml", "mxf", "cli", "st2001"]
categories   = ["command-line-utilities", "multimedia"]
include      = ["src/**", "registers/**"]

[[bin]]
name = "regxmllib-rs"
path = "src/bin/regxmllib_rs.rs"

[dependencies]
smpte-types = { path = "../smpte-types", version = "0.1.1" }
smpte-klv   = { path = "../smpte-klv",   version = "0.1.1" }
smpte-mxf   = { path = "../smpte-mxf",   version = "0.1.1" }
regxml-dict = { path = "../regxml-dict", version = "0.1.1" }
regxml      = { path = "../regxml",      version = "0.1.1" }
clap        = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
quick-xml = { workspace = true }
